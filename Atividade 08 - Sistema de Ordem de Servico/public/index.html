<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Ordem de Serviço</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .status-aberta { border-left: 5px solid green; }
        .status-andamento { border-left: 5px solid orange; }
        .status-concluida { border-left: 5px solid gray; }
        input, select, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <h1>Sistema de Ordens de Serviço</h1>

    <div style="background: #f4f4f4; padding: 15px;">
        <h3>Nova Ordem de Serviço</h3>
        <input type="text" id="titulo" placeholder="Título da OS" required>
        <input type="text" id="descricao" placeholder="Descrição detalhada" required>
        <div class="row">
            <select id="prioridade">
                <option value="baixa">Prioridade: Baixa</option>
                <option value="média">Prioridade: Média</option>
                <option value="alta">Prioridade: Alta</option>
            </select>
            <input type="text" id="setor" placeholder="Setor Solicitante" required>
        </div>
        <div class="row">
            <input type="number" id="valor" placeholder="Valor (R$)" required>
            <input type="text" id="responsavel" placeholder="Responsável (Opcional)">
        </div>
        <button onclick="criarOS()" style="background: #007bff; color: white;">Criar OS</button>
    </div>

    <hr>
    
    <div class="row">
        <input type="text" id="busca" placeholder="Filtrar por título..." onkeyup="carregarOS()">
        <select id="filtroStatus" onchange="carregarOS()">
            <option value="">Todos Status</option>
            <option value="aberta">Aberta</option>
            <option value="em andamento">Em Andamento</option>
            <option value="concluída">Concluída</option>
        </select>
    </div>

    <div id="listaOS"></div>

    <script>
        const API = 'http://localhost:3000/api/ordens';

        async function carregarOS() {
            const busca = document.getElementById('busca').value;
            const status = document.getElementById('filtroStatus').value;
            
            let url = `${API}?titulo=${busca}`;
            if(status) url += `&status=${status}`;

            const res = await fetch(url);
            const dados = await res.json();
            const lista = document.getElementById('listaOS');
            lista.innerHTML = '';

            dados.forEach(os => {
                const div = document.createElement('div');
                div.className = `card status-${os.status === 'em andamento' ? 'andamento' : os.status}`;
                div.innerHTML = `
                    <h3>${os.titulo} <small>(${os.status})</small></h3>
                    <p><strong>Setor:</strong> ${os.setorSolicitante} | <strong>Prioridade:</strong> ${os.prioridade}</p>
                    <p>${os.descricao}</p>
                    <p><strong>Valor:</strong> R$ ${os.valor} | <strong>Resp:</strong> ${os.responsavel || 'Não atribuído'}</p>
                    <button onclick="mudarStatus('${os._id}', 'em andamento')">Em Andamento</button>
                    <button onclick="mudarStatus('${os._id}', 'concluída')">Concluir</button>
                    <button onclick="deletarOS('${os._id}')" style="background: red; color: white;">Excluir</button>
                `;
                lista.appendChild(div);
            });
        }

        async function criarOS() {
            const os = {
                titulo: document.getElementById('titulo').value,
                descricao: document.getElementById('descricao').value,
                prioridade: document.getElementById('prioridade').value,
                setorSolicitante: document.getElementById('setor').value,
                valor: document.getElementById('valor').value,
                responsavel: document.getElementById('responsavel').value
            };

            await fetch(API, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(os)
            });
            carregarOS();
            alert('OS Criada!');
        }

        async function mudarStatus(id, novoStatus) {
            await fetch(`${API}/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ status: novoStatus })
            });
            carregarOS();
        }

        async function deletarOS(id) {
            if(confirm('Tem certeza?')) {
                await fetch(`${API}/${id}`, { method: 'DELETE' });
                carregarOS();
            }
        }

        carregarOS();
    </script>
</body>
</html>
