<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Despesas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main>
        <h1>Controle de Despesas</h1>

        <form id="expense-form">
            <div class="form-control">
                <label for="description">Descrição</label>
                <input type="text" id="description" placeholder="Ex: Almoço" required>
            </div>
            <div class="form-control">
                <label for="amount">Valor</label>
                <input type="number" id="amount" placeholder="Ex: 55.20" step="0.01" required>
            </div>
            <div class="form-control">
                <label for="date">Data</label>
                <input type="date" id="date">
            </div>
            <button type="submit" class="btn btn-submit">Cadastrar Despesa</button>
        </form>

        <h2 id="totalExpenses">Total das Despesas: R$0.00</h2>

        <ul id="expense-list">
            </ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
